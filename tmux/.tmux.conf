# ============================================
# Devsimsek's tmux config
# ============================================

# Prefix key (Ctrl+B is default)
set -g prefix C-b
unbind C-b
bind C-b send-prefix

# Colors
set -g default-terminal "tmux-256color"

# Numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# History
set -g history-limit 10000

# Mouse support
set -g mouse on

# Performance
set -s escape-time 10
set -g focus-events on

# Auto-rename windows
setw -g automatic-rename on

# ============================================
# Keybindings
# ============================================

# Intuitive pane splitting
unbind '"'
unbind '%'
bind | split-window -h
bind - split-window -v

# Pane navigation with Alt+Arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Ctrl+Alt+Arrow
bind -n C-M-Left resize-pane -L 5
bind -n C-M-Right resize-pane -R 5
bind -n C-M-Up resize-pane -U 5
bind -n C-M-Down resize-pane -D 5

# Window navigation with Shift+Arrow
bind -n S-Left previous-window
bind -n S-Right next-window

# ============================================
# Status Bar
# ============================================

# Rosé Pine Moon theme (hex)
set -g status-position bottom
set -g status-justify left
set -g status-bg '#2a273f'        # Surface
set -g status-fg '#e0def4'        # Text

set -g status-left "#[bg=#232136,fg=#eb6f92] #S #[default] "
set -g status-left-length 20

set -g status-right "#[fg=#56526e]%H:%M #[fg=#eb6f92]%a %d-%b #[fg=#56526e](c)devsimsek"
set -g status-right-length 50

setw -g window-status-format "#[fg=#6e6a86] #I:#W#F "
setw -g window-status-current-format "#[bg=#eb6f92,fg=#232136] #I:#W#F #[default]"

# pane borders
set -g pane-border-style fg='#44415a'       # Highlight Med
set -g pane-active-border-style fg='#eb6f92' # Love (accent)

# message and pane indicators
set -g message-style bg='#232136',fg='#e0def4'
set -g display-time 3000



